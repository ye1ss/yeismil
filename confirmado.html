<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Confirmado! | YEISMIL</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .confirmation-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: var(--space-xl);
        }
        .confirmation-icon {
            width: 80px;
            height: 80px;
            background: var(--color-primary);
            border: 3px solid var(--color-black);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: var(--space-lg);
        }
        .confirmation-icon .material-symbols-outlined {
            font-size: 3rem;
        }
        .confirmation-title {
            font-family: var(--font-display);
            font-size: 3rem;
            margin-bottom: var(--space-md);
        }
        .confirmation-text {
            font-size: 1.125rem;
            color: var(--color-gray-600);
            max-width: 400px;
            margin-bottom: var(--space-xl);
        }
    </style>
</head>
<body>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    
    <main class="confirmation-page">
        <div class="confirmation-icon">
            <span class="material-symbols-outlined">check</span>
        </div>
        <h1 class="confirmation-title">¡CONFIRMADO!</h1>
        <p class="confirmation-text">
            Tu email ha sido verificado correctamente. 
            Ahora recibirás todas las novedades que vaya construyendo.
        </p>
        <a href="/" class="btn-primary">
            <span>Volver al inicio</span>
            <span class="material-symbols-outlined">arrow_forward</span>
        </a>
    </main>
</body>
</html>
